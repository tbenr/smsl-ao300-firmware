services:
  ser2net:
    build: .
    container_name: firmware-tunnel
    restart: unless-stopped
    ports:
      # No authentication: whoever reaches this port can flash the amp. The default listens on
      # this machine only (use an SSH tunnel); AO300_BIND=0.0.0.0 in .env opens it to the network.
      - "${AO300_BIND:-127.0.0.1}:4000:4000"
    devices:
      # Stable path from `ls /dev/serial/by-id/`; adjust to what the amp shows as. Mapped to the
      # fixed name ser2net.yaml expects. The container waits (restarting) until it exists.
      - /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0:/dev/ttyUSB0
    volumes:
      - ./ser2net.yaml:/etc/ser2net/ser2net.yaml:ro
